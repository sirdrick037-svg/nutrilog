<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NutriLog</title>
</head>

<body>
    <h1>NutriLog</h1>

    <h2>Add a Meal</h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Add Meal
        </button>

    </form>

    <h2>Meals</h2>

    {% if meals %}

        <ul>

            {% for meal in meals %}

                <li>
                    {{ meal.name }}
                    -
                    {{ meal.calories }} calories
                    -
                    {{ meal.date }}
                    -
                    <a href="{% url 'edit_meal' meal.id %}">Edit</a>
                </li>

            {% endfor %}

        </ul>

    {% else %}

        <p>No meals have been added yet.</p>

    {% endif %}

    <p>Total Calories: {{ total_calories }}</p>

</body>

</html>
